name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (tags can be moved by an attacker).
jobs:
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov-report=xml

      - name: Sigma rules lint
        run: uv run threatlens rules lint --dir rules/examples

      - name: Sigma rule tests (true/false positive fixtures)
        run: uv run threatlens rules test --dir rules/examples --tests tests/rules --require-fixtures

  docker:
    name: Docker build, smoke test & Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: threatlens:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (hardened run)
        run: |
          docker run -d --name tl -p 127.0.0.1:8080:8080 -v tl-data:/data \
            --read-only --cap-drop ALL --security-opt no-new-privileges threatlens:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tl)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs tl
          [ "$status" = healthy ] || { echo "container not healthy: $status"; exit 1; }
          curl -fsS http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 303
          docker exec tl id -u | grep -qx 10001

      - name: Ports are published on 127.0.0.1 only
        run: |
          # The running container (documented docker run command):
          docker port tl
          test -z "$(docker port tl | grep -v '127.0.0.1:')"
          # The Compose file as Docker renders it, with a custom host port:
          TL_HOST_PORT=18090 docker compose config --format json | python3 -c '
          import json, sys
          ports = [p for s in json.load(sys.stdin)["services"].values() for p in s.get("ports", [])]
          assert ports, "no ports rendered"
          for p in ports:
              assert p.get("host_ip") == "127.0.0.1", f"not localhost-only: {p}"
              assert str(p.get("published")) == "18090", f"TL_HOST_PORT ignored: {p}"
          print("compose ports OK:", ports)
          '

      - name: Image size
        run: |
          docker image ls threatlens:ci
          echo "compressed: $(docker save threatlens:ci | gzip | wc -c | awk '{printf "%.0f MB", $1/1e6}')"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: threatlens:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
