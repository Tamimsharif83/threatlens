[project]
name = "threatlens"
version = "0.1.0"
description = "Lightweight, self-hosted detection & investigation platform (mini-SIEM) built on Sigma rules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tamim Sharif" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "jinja2>=3.1.6,<4",
    "pydantic-settings>=2.16,<3",
    "argon2-cffi>=25.1,<26",
    "python-multipart>=0.0.20",
    "click>=8.2,<9",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/Tamimsharif83/threatlens"
Issues = "https://github.com/Tamimsharif83/threatlens/issues"

[project.scripts]
threatlens = "threatlens.cli.main:cli"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "httpx2>=2.16",
    "pre-commit>=4.3",
    "pyyaml>=6.0",
    # Used by the storage-layout spike (scripts/bench); become runtime deps in Phase 2.
    "pysigma>=2.0.2,<3",
    "pysigma-backend-sqlite>=2.1.1,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatlens"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "N", "PL", "TRY", "DTZ", "ANN",
]
ignore = [
    "PLR0913", # many args are fine for settings/factories
    "TRY003",  # long messages in exceptions are fine
    "PLR2004", # magic values in comparisons
    "PLR0917", # FastAPI endpoints take many injected parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "ANN", "PLR2004", "S608"]
"scripts/**" = ["S", "ANN", "T20", "PL", "E501", "DTZ", "RUF005"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/threatlens"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=threatlens --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:threatlens.*"]

[tool.coverage.run]
branch = true
source = ["threatlens"]
