<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  {# htmx hardening: no eval, no script execution from swapped HTML, same-origin only,
     and no page snapshots in localStorage (pages contain log data). #}
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"selfRequestsOnly":true,"historyCacheSize":0,"refreshOnHistoryMiss":true}'>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}ThreatLens{% endblock %}</title>
  <link rel="icon" href="{{ static('img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static('css/app.css') }}">
  <script src="{{ static('vendor/htmx/htmx.min.js') }}" defer></script>
  <script src="{{ static('js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
